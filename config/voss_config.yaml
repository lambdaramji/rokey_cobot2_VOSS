# docs/interfaces/voss_config.md 가 스키마. 값의 출처는 docs/measurements-1006.md (10/06 실측).
version: 1
zone_map:
  역삼동: A
  대치동: B
  청담동: C
aliases:
  역삼동: [역삼, 역삼동]
  대치동: [대치, 대치동]
  청담동: [청담, 청담동]
zones:   # 플랜지 기준 posx (TCP 미적용), 트레이 안쪽 바닥 중심, 박스 밑면 +5 mm (10/06 트레이 설치 후). grid: cols = X(벨트 방향), rows = Y
  A:       {pose: [213.49, 165.23, 258.27, 35.36, -180.0, -54.64], grid: {cols: 3, rows: 1, pitch_mm: 60}}
  B:       {pose: [446.08, 160.78, 258.94, 14.28, 180.0, -75.33], grid: {cols: 3, rows: 1, pitch_mm: 60}}
  C:       {pose: [675.14, 158.69, 260.94, 159.7, -180.0, 70.28], grid: {cols: 3, rows: 1, pitch_mm: 60}}
  recheck: {pose: [446.17, -69.04, 260.65, 169.44, -180.0, 79.38], grid: {cols: 2, rows: 1, pitch_mm: 60}}
  hold:    {pose: [674.12, -71.37, 262.65, 168.88, -180.0, 78.38], grid: {cols: 2, rows: 1, pitch_mm: 60}}
observe_pose: [-11.51, -271.11, 450.16, 85.25, -179.07, -6.03]   # 플랜지 기준. 홈과 같음
robot:
  tcp_offset_mm: [1.382, 2.684, 246.642]   # 플랜지 → 핑거 끝 TCP (툴 좌표). 펜던트 등록값 (measurements #6)
belt:
  speed_cmps: 4.8          # 아두이노 h250
  direction_base: [0.99992, -0.01292, 0.0]   # 진행 방향 단위벡터(베이스 기준), +x 에서 −0.74°, z = 0 수평 성분만 (measurements #6, 김학민)
gripper:   # 폭은 RG2 보고값. 실측 안쪽 간격: 보고 90 → 80 mm, 빈손 보고 39 → 28 mm(10/08), 박스 파지 보고 40.3 → 30 mm(10/06) — 차이 10~11 mm 의 관측 특성이라 보정식으로 쓰지 않는다 (measurements #8)
  pre_open_mm: 90
  grasp_width_mm: 39
  force_n: 14.0
ocr:
  confidence_min: 0.6
  codes: {"S07-01": "역삼동", "S07-02": "대치동", "S07-03": "청담동"}
timing:
  latency_offset_ms: 0     # 0 = 보정 없음(유효값). 양수 = 벨트 방향으로 앞당겨 예측 (박병후 튜닝)
