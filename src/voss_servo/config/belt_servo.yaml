# belt_servo 전용 파라미터 (design/U1-dd.md 1절).
# - belt.* · gripper.* · timing.* · config_version · config_sha256 은 이 파일에 쓰지 않는다.
#   원본은 config/voss_config.yaml 이고 bringup launch 가 넘긴다 (CLAUDE.md 규칙 5).
# - null = 미측정. launch 는 null 키를 넘기지 않고, 노드는 값이 안 온 필수 키가 있으면 READY 를 거부한다.
#   (--params-file 로 직접 주면 null 이 문자열 "null" 로 들어오고, 노드는 그것도 미측정으로 보고 READY 를 거부한다.
#    null 을 걸러 넘기는 launch 는 U3 sim.launch)
# - 주석의 "제안" 값은 미측정 제안값이다(ADR-0012 승인 수치 목표의 범위 밖). 실측 근거가 생기면 measurements 와 함께 채운다.
#   제안값의 근거·성격(측정/계산/판단)·확정 단위는 design/U2-dd.md 7절.
belt_servo:
  ros__parameters:
    grasp:
      tcp_z_below_top_mm: 19.0      # 파지 높이 TCP z = position_base.z − 19 mm (결정값, topics.md·pending #16)
      # 쥔 폭 범위 = "쥐었다고 인정하는 RG2 보고 폭" (grip_detected 가 주 판정, 폭은 보조). measurements-1008 #14 (T34):
      # 빈손 38.0~38.7 (범위 아래로 빠져야 함) · 0° 40.7~41.2 · 15°·30° 회전 42.0~43.0. 경계값은 제안
      hold_width_min_mm: 39.5       # 빈손 최대 38.7 + 0.8 (쥔 최소 40.7 과는 1.2)
      hold_width_max_mm: 44.0       # 10/10 G1 현장값(measurements-1010 #10), 회전 박스 42.0~43.0 + 여유 1.0
      close_time_max_s: 2.5         # 닫힘 90→39 최대 시간. x 여유 계산·후퇴 개방 대기 상한에 쓴다. 이력: 10/10 최대 2128 ms(measurements-1010 7·8절) 위로 2.1→2.3 (U9-c).
                                    # 2.3→2.5 (S2-T29 10/13 결정): 10/12 닫기 응답 최대 2.467 s, 2.3 초과 5건(RG2 busy 구간, measurements-1012·FIELD-1012 ①)
      room_margin_mm: 10.0          # x 여유 덧셈 (제안, 판단값). 정렬 순간 x_max − TCP x ≥ 벨트속도 × (하강 예상 + close_time_max) + 이 값
                                    # 이어야 DESCEND (아니면 OUT_OF_REACH, cause REACH_GRASP_ROOM). 하강 예상은 노드가 kp_z·descend_speed 로 계산
    reach:
      x_min_mm: -107.0              # 추종 가능 구간 TCP x (measurements #6, 748 mm)
      x_max_mm: 550.0               # 유효값 (측정 구간은 638, measurements #6). 이력: 620 → 600 (U9-c): x 600~618 에서 TRACK z 가 처지고
                                    # (measurements-1010 #13) 두산 특이점 안내 3205/3206 이 x≈600 에서 났다(#14). gateway x 자름(638 − 램프 11.5)보다 먼저 끝낸다.
                                    # 600 → 550 (S2-T29 10/13 결정): 10/12 goal 안 특이점 안내 3205 가 x≈564.5 에서 1회(measurements-1012·FIELD-1012 ③).
                                    # 정상 경로 최대 x ≈ 422(후퇴 끝)라 영향 없음
    control:
      kp_per_s: null                # P 게인 (1/s). 0 = FF 만. U4 실기에서 정함
      kp_z_per_s: null              # z P 게인 (1/s). kp_z × descend_speed ≤ max_acc (descend 0.05 면 ≤ 2). U4
      align_tol_along_mm: null      # 벨트 방향 정렬 허용치. 제안 3 (이동 중 좌표 오차 최대 2.73 mm, measurements-1008 #5)
      align_tol_cross_mm: null      # 가로 정렬 허용치. 제안 5, 상한 10 (확정)
    limits:
      max_speed_mps: null           # TCP 선속도 상한. 제안 0.08 (gateway 100 mm/s 보다 작게, 판단값)
      max_acc_mps2: null            # 가속 상한. 제안 0.1 (= gateway servo_acc 100 mm/s² 로봇 램프, measurements #3)
    z:
      approach_above_top_mm: null   # 하강 전 대기 높이 (관측 박스 윗면 기준). cutoff + 5 보다 커야 함
      lift_above_top_mm: null       # 들기 안전 높이 (관측 박스 윗면 기준)
      vision_cutoff_above_top_mm: null  # 이 높이 아래는 비전 사각. 제안 30 — 카메라 실제 이탈 윗면 +27~37 mm
                                        # (measurements-1010 '의도 시험', U9a-hld). cutoff+5 < approach, height_tol < approach−(cutoff+5)
      descend_speed_mps: null       # 하강 속도 상한. 제안 0.05 (상한 약 0.06, U4 에서 바닥 근처 정지 거리 확인)
      lift_speed_mps: null          # 들기 속도 상한. 제안 0.08 (= max_speed)
      height_tol_mm: null           # "높이 도달" 허용치. 제안 2
      profile: p                    # z 속도 프로파일 (선택 키, 없어도 p). p = P 제어(시연 라인) / trapezoid = DESCEND·LIFT 사다리꼴
                                    # (S2-T14, design/S2T14-hld.md). 되돌림은 p 한 줄 + belt_servo 재기동
    input:
      stale_timeout_s: null         # position_valid=false·pose 끊김 지속 기준. 제안 0.3
      lost_timeout_s: null          # 내 track_id 미수신 지속 기준. 제안 0.5 (트래커 15프레임). DESCEND 경주는 cutoff 30 으로 없앰 (U9a)
      pose_lag_ms: 60.0             # pose stamp 가 실제보다 늦은 시간. gateway pose_source 와 짝: joint_states 운용 = 0(10/10 PL 시험값, measurements-1010 #10), service = 60(임시값).
                                    # box_tracker 의 15 는 영상 대비 상대 지연이라 여기 쓰지 않음(DESIGN DEC-03)
      pose_extrap_max_ms: null      # TCP 외삽 지평 상한 (넘으면 상한까지만 외삽). 제안 200 (≥ pose_lag + 120: pose 값 0.1 s 갱신 + 메시지 20 ms)
      blind_entry_max_age_s: null   # 하강 시작 때 마지막 유효 관측 나이(촬영 시각 기준) 상한. 제안 0.15. TRACK→DESCEND 전환에서만 씀 (cutoff 와 무관)
    retry:
      max_attempts: 1               # 1~3. 1 유지 (U9b-dd 1절: 현장 정렬 x 에서는 재시도 x 여유가 없어 켜도 안전 후퇴)
    stop_timeout_s: 1.0             # stop 응답 기다리는 한계. 제안
    gripper_timeout_s: 4.0          # 그리퍼 응답 기다리는 한계 (요청 한 건마다).
                                    # 4.0 — **임시책**(10/13 사용자 결정): 10/12 경주 해결 전 기울어진 박스 실기(26°)에서 닫힘 3.08 s 로 3.0 초과 → DEVICE_ERROR(실제로는 쥠).
                                    # J6 회전 파지(S2-T18)가 들어오면 3.0 으로 재검토. 교차 검사 > close_time_max 2.5 통과.
                                    # 참고: gateway rg2_timeout_s 6.0 — belt_servo 가 4 s 에 포기해도 RG2 는 최대 6 s 까지
                                    # 잡혀 있어 다음 요청이 BUSY 가 될 수 있다 (BUSY 는 0.5 s 뒤 한 번 더 요청, 그래도 BUSY 면 DEVICE_ERROR)
    rate_hz: 30.0                   # 서보 루프 (topics.md 계약)
    zero_hold_s: 0.5                # goal 종료 뒤 0 속도 유지. 제안 (watchdog 200 ms + 정지 0.15~0.41 s 보다 길게)
    rotate:                         # S2-T18 J6 회전 파지 (기능 플래그, 기본 off). design/S2T18-{hld,dd,pseudo}.md
      enable: false                 # true 면 아래 값이 모두 필요(null 이면 READY 거부), input.pose_lag_ms 0(joint_states) 전제.
                                    # 기준 공구 yaw 를 고정하려면 rotate.home_tool_yaw_deg 를 더한다(없으면 노드 기동 뒤 첫 goal 공구 yaw)
      deadband_deg:               null  # 제안 4 — 데드밴드 — |Δ| 이하는 돌리지 않음. 검출 바닥 1.3° + 송장 붙임 공차(yaw 관측 실험 뒤 확정)
      min_deg:                    null  # 제안 10 — 1단계: |Δ| ≤ 10° 는 돌리지 않음 (TR-SERVO-05 단계 적용). 5단계에서 deadband 와 같게
      max_deg:                    null  # 제안 45 — 1단계 상한 — 넘으면 돌리지 않고 진행(pending #27 a 안). 간섭·측정 ② 뒤 90
      n_min:                      null  # 제안 5 — 목표 각 결정에 필요한 유효 yaw 프레임 수 (box_tracker min_hits 와 같음)
      buffer_n:                   null  # 제안 15 — 트랙별 yaw 버퍼 길이 (goal 전부터 모음, D1 A 안)
      r_min:                      null  # 제안 0.97 — 흩어짐 하한 — 2θ 평균 벡터 길이 (≈ 흩어짐 7°)
      decide_max_s:               null  # 제안 0.5 — goal 뒤 결정 마감 — 넘으면 NO_YAW 로 회전 없이 진행
      start_tol_deg:              null  # 제안 3 — goal 시작 공구 yaw 가 기준에서 이만큼 벗어나면 START_ROTATED (기준 = 첫 goal 공구 yaw)
      omega_max_dps:              null  # 제안 60 — 각속도 상한 (T17 전 제안값 — 학민 확인)
      alpha_dps2:                 null  # 제안 90 — 각가속 (T17 전 제안값). gateway servo_acc[1] 이하여야 함 — 지금 gateway 기본 10
      tol_deg:                    null  # 제안 1.5 — 도달 허용 (deadband 보다 작아야 함)
      omega_floor_dps:            null  # 제안 3 — 끝에서 멈춰 버리지 않게 하는 최소 각속도
      hold_dz_mm:                 null  # 제안 50 — 회전 중 z 하한 = 윗면 + 50 (시야 보험: 회전 중 송장이 보이는 최소 +46, D2-2)
      settle_s:                   null  # 제안 0.3 — 멈춘 뒤 정착 시간 (pose·비전이 따라오는 시간)
      stall_s:                    null  # 제안 0.6 — 명령하고 이 시간 동안 1° 도 못 돌면 STALL (T17 전 gateway·sim 은 여기로 폴백)
      still_dps:                  null  # 제안 2 — 이 각속도 아래면 멈춘 것
      return_min_dz_mm:           null  # 제안 10 — LIFT·VERIFY 되돌리기는 TCP 가 윗면 + 10 위일 때만
      pose_fresh_s:               null  # 제안 0.05 — pose 주기의 2배 이상(joint_states 50 Hz → 0.05). 이보다 최근에 pose 가 왔는데 값이 그대로면 정지
    log:
      dir: data/servo               # 상대 경로는 실행 위치 기준. launch 는 절대 경로를 넘긴다
