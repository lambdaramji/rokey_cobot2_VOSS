# belt_servo 시뮬 파라미터 — **sim 전용, 실기 금지** (design/U3-dd.md 3절)
#
# - sim.launch.py 가 robot_gateway dry_run(가짜 로봇·가짜 RG2) + fake_box 와 함께 쓴다.
# - 값은 미측정 제안값이다 (sim 동작 확인용). 실기 값은 belt_servo_real.yaml.example 을 복사해 측정값으로 채운다.
# - kp_per_s 1.0 · approach 40 · lift 50 은 U3 사전 실험에서 쓴 값이다 (design/U3-hld.md 2절). 나머지는 U2 DD 7절 제안값.
# - log.dir 은 /tmp 절대 경로: log_dir 없이 띄워도 git 추적 폴더 data/servo/attempts/(게이트 증거)를 오염시키지 않게.
# - 키 목록은 config/belt_servo.yaml 과 같아야 한다 (test_launch_params T-L12). close_time_max_s·room_margin_mm·
#   gripper_timeout_s 는 U5 #131 의 새 필수 키를 미리 넣은 것 (#131 머지 전 main 노드는 무시).
belt_servo:
  ros__parameters:
    grasp:
      tcp_z_below_top_mm: 19.0
      hold_width_min_mm: 39.5
      hold_width_max_mm: 44.0       # 10/10 G1 현장값(measurements-1010 #10), 회전 박스 42.0~43.0 + 여유 1.0
      close_time_max_s: 2.5         # 이력 2.3: 10/10 닫힘 최대 2128 ms (measurements-1010 7·8절, U9-c).
                                    # 2.5: 10/12 최대 2.467 s (measurements-1012·FIELD-1012 ①, S2-T29 10/13 결정)
      room_margin_mm: 10.0
    reach:
      x_min_mm: -107.0
      x_max_mm: 550.0               # 이력 U9-c: 620 → 600 (measurements-1010 #13·#14).
                                    # 600 → 550: 10/12 특이점 안내 3205 x≈564.5 (measurements-1012·FIELD-1012 ③, S2-T29 10/13 결정)
    control:
      kp_per_s: 1.0
      kp_z_per_s: 1.5
      align_tol_along_mm: 3.0
      align_tol_cross_mm: 5.0
    limits:
      max_speed_mps: 0.08
      max_acc_mps2: 0.1
    z:
      approach_above_top_mm: 40.0
      lift_above_top_mm: 50.0
      vision_cutoff_above_top_mm: 30.0  # 카메라 실제 이탈 윗면 +27~37 mm (measurements-1010 '의도 시험', U9a-hld)
      descend_speed_mps: 0.05
      lift_speed_mps: 0.08
      height_tol_mm: 2.0
      profile: p                    # S2-T14. sim_check --z-profile trapezoid / sim.launch z_profile:=trapezoid 로 덮어쓴다
    input:
      stale_timeout_s: 0.3
      lost_timeout_s: 0.5           # DESCEND 경주는 cutoff 30 으로 없앰 (U9a)
      pose_lag_ms: 60.0             # gateway pose_source 와 짝: joint_states 운용 = 0(10/10 PL 시험값, measurements-1010 #10), service = 60(임시값).
                                    # box_tracker 의 15 는 영상 대비 상대 지연이라 여기 쓰지 않음(DESIGN DEC-03)
      pose_extrap_max_ms: 200.0
      blind_entry_max_age_s: 0.15   # TRACK→DESCEND 전환에서만 씀 (cutoff 와 무관)
    retry:
      max_attempts: 1
    stop_timeout_s: 1.0
    gripper_timeout_s: 4.0          # 4.0 — **임시책**(10/13 사용자 결정): 10/12 경주 해결 전 기울어진 박스 실기(26°)에서 닫힘 3.08 s 로 3.0 초과 → DEVICE_ERROR(실제로는 쥠).
                                    # J6 회전 파지(S2-T18)가 들어오면 3.0 으로 재검토. 교차 검사 > close_time_max 2.5 통과.
                                    # 참고: gateway rg2_timeout_s 6.0 이라 4 s 에 포기해도 다음 요청이 BUSY 일 수 있다
    rate_hz: 30.0
    zero_hold_s: 0.5
    rotate:                         # S2-T18 J6 회전 파지 (기능 플래그, 기본 off). design/S2T18-{hld,dd,pseudo}.md
      enable: false                 # true 면 아래 값이 모두 필요(null 이면 READY 거부), input.pose_lag_ms 0(joint_states) 전제.
                                    # 기준 공구 yaw 를 고정하려면 rotate.home_tool_yaw_deg 를 더한다(없으면 노드 기동 뒤 첫 goal 공구 yaw)
      deadband_deg:               4     # 데드밴드 — |Δ| 이하는 돌리지 않음. 검출 바닥 1.3° + 송장 붙임 공차(yaw 관측 실험 뒤 확정)
      min_deg:                    10    # 1단계: |Δ| ≤ 10° 는 돌리지 않음 (TR-SERVO-05 단계 적용). 5단계에서 deadband 와 같게
      max_deg:                    45    # 1단계 상한 — 넘으면 돌리지 않고 진행(pending #27 a 안). 간섭·측정 ② 뒤 90
      n_min:                      5     # 목표 각 결정에 필요한 유효 yaw 프레임 수 (box_tracker min_hits 와 같음)
      buffer_n:                   15    # 트랙별 yaw 버퍼 길이 (goal 전부터 모음, D1 A 안)
      r_min:                      0.97  # 흩어짐 하한 — 2θ 평균 벡터 길이 (≈ 흩어짐 7°)
      decide_max_s:               0.5   # goal 뒤 결정 마감 — 넘으면 NO_YAW 로 회전 없이 진행
      start_tol_deg:              3     # goal 시작 공구 yaw 가 기준에서 이만큼 벗어나면 START_ROTATED (기준 = 첫 goal 공구 yaw)
      omega_max_dps:              60    # 각속도 상한 (T17 전 제안값 — 학민 확인)
      alpha_dps2:                 90    # 각가속 (T17 전 제안값). gateway servo_acc[1] 이하여야 함 — S2-T17(#56) 기본 90, 그 전 gateway 는 10
      tol_deg:                    1.5   # 도달 허용 (deadband 보다 작아야 함)
      omega_floor_dps:            3     # 끝에서 멈춰 버리지 않게 하는 최소 각속도
      hold_dz_mm:                 50    # 회전 중 z 하한 = 윗면 + 50 (시야 보험: 회전 중 송장이 보이는 최소 +46, D2-2)
      settle_s:                   0.3   # 멈춘 뒤 정착 시간 (pose·비전이 따라오는 시간)
      stall_s:                    0.6   # 명령하고 이 시간 동안 1° 도 못 돌면 STALL (T17 전 gateway·sim 은 여기로 폴백)
      still_dps:                  2     # 이 각속도 아래면 멈춘 것
      return_min_dz_mm:           10    # LIFT·VERIFY 되돌리기는 TCP 가 윗면 + 10 위일 때만
      pose_fresh_s:               0.05  # pose 주기의 2배 이상(joint_states 50 Hz → 0.05). 이보다 최근에 pose 가 왔는데 값이 그대로면 정지
    log:
      dir: /tmp/voss_sim/servo
