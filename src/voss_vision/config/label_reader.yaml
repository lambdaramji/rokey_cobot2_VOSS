# label_reader 파라미터 (ADR-0008). voss_config 는 config_path 로 읽는다(confidence_min·버전 로그). 후보는 zone_map 토픽.
label_reader:
  ros__parameters:
    ocr_device: cpu            # cpu | gpu:0. G0 는 호스트 CPU. GPU 는 VRAM 8 GB 를 Whisper 와 나눠 쓰므로 T22(비전 컨테이너)에서 정한다
    ocr_enable_mkldnn: false   # paddle 3.3 CPU 의 oneDNN 오류 회피
    upright_scale: 3.0         # 송장 펴기 확대 배율 (T18 기준)
    label:
      v_min: 200               # 송장 흰색 HSV (box_tracker seg 와 같은 값)
      s_max: 90
      close_px: 5              # 테두리 작은 끊김만 잇는다. 글자 구멍은 윤곽 채움으로 메운다
    stage1_enough: 2           # 같은 동 크롭 ≥ 2 장 + 투표 신뢰도 ≥ confidence_min 이면 그 트랙은 더 읽지 않는다
    track_forget_s: 30.0       # 이만큼 크롭이 안 온 트랙의 판독 기록을 지운다
    stage2:                    # 추종 중 2차 판독 (T19 2차, BRD TR-OCR-02, label_stage2.py). 10/15 실기(틀린 구역 0) 뒤 기본 켬 — ADR-0008
      enable: true             # 끄기: launch 인자 stage2:=false (볼 것: belt_servo 틱 주기, sort_manager "추종 중 판독 확정"·"늦게 도착")
      max_ocr: 3               # 트랙당 OCR 최대 장수 (CPU 장당 약 2 s, 180° 다시 읽으면 2배 — TrackAndGrasp 약 11 s 안)
      min_agree: 2             # 같은 동 이만큼 + confidence_min 이상 + 반대표 없음일 때만 2단계를 발행한다(1장·갈린 판독으로 구역이 바뀌지 않게). 같은 동이 이만큼 모이면 그 트랙은 더 읽지 않는다
      min_sharpness: 0.0       # 이보다 흐린 크롭은 읽지 않는다 (box_tracker 라플라시안 분산과 같은 척도, 공용 PC 영상으로 정한다)
      skip_confident_stage1: true  # 1단계 발행이 모두 확실했던 트랙은 읽지 않는다 — sort_manager 는 재확인행 박스에만 2단계를 쓴다
      flip_retry: true         # 글자가 없으면 180° 돌려 한 번 더 (거꾸로 올린 박스 구제 — 1단계는 10/12 부터 끔)
      flip_first: true         # 1단계에서 송장은 찾았는데 글자를 못 읽은 트랙은 180° 먼저 (10/15 실기: 장당 5.5 → 2.3 s). 판정이 나온 방향은 트랙마다 기억
      stage1_hold_s: 0.5       # 1단계를 발행한 트랙의 다음 1단계 읽기를 미룬다 — 그사이 2단계 크롭이 오면(집으러 감) 버린다. 0 = 안 미룸
    stats_period_s: 5.0        # 입력·판독·OCR 지연 로그 주기
    debug_save_dir: ""         # 지정하면 펴진 송장 크롭을 png 로 남긴다(현장 확인·T19 데이터용, 커밋 금지)
    view:                      # 재판독 /voss/vision/read_label (stage 3, T23). 송장 크기·영역은 재확인 VIEW 자세 사진으로 정한다
      image_topic: /camera/color/image_raw   # 요청 동안만 구독
      max_frames: 5            # 요청 max_frames=0 일 때 모을 장수
      timeout_s: 2.0           # 요청 timeout_s=0 일 때 프레임 모으는 시간 한도
      max_ocr: 3               # 모은 것 중 선명한 순으로 OCR 할 최대 장수 (CPU 장당 약 1.7 s)
      min_agree: 2             # 같은 동 이만큼 + confidence_min 이상이면 남은 프레임은 안 읽는다
      ocr_wait_s: 10.0         # 프레임 모은 뒤 OCR 결과를 기다리는 한도 → 넘으면 message timeout
      # 아래 값(area_*·aspect_tol·roi·slot_rois, slot_rois 의 경계 y 555 포함)은 10/08 VIEW 자세(view_pose #116) 사진 11장 기준
      # — view_pose 를 바꾸면 다시 잰다 (measurements-1008 #13)
      area_min_px: 12000       # 송장 면적(px). VIEW 송장 174~177 × 108~110 px ≈ 19000 px
      area_max_px: 30000       # 트레이 흰 띠 조각(241×197 ≈ 47000 px, S1_0701)을 거른다
      aspect_tol: 0.25         # 가로세로비 40:25 = 1.6 ± 0.25 (사진 1.59~1.62)
      fill_min: 0.75           # 회전 사각형 대비 채움 (흰 띠·얼룩 거르기)
      roi: [600, 150, 1360, 960]   # x0 y0 x1 y1 (px) = 재확인 트레이 안쪽. 칸 0 송장 y ≈ 420, 칸 1 ≈ 690. 이 영역 중심에 가까운 송장을 읽는다
      slot_rois: [600, 150, 1360, 555, 600, 555, 1360, 960]   # 칸 0·1 화면 영역(x0 y0 x1 y1 씩, 칸 번호 = MoveToZone 재확인 칸 번호). ReadLabel.slot 이 오면 그 칸 영역 중심에 가까운 송장만 읽는다
                               # (칸 0 = 화면 위, 칸 1 = 아래. 경계 y 555 = 두 송장 중심 420·690 의 가운데)
