# label_reader 파라미터 (ADR-0008). voss_config 는 config_path 로 읽는다(confidence_min·버전 로그). 후보는 zone_map 토픽.
label_reader:
  ros__parameters:
    ocr_device: cpu            # cpu | gpu:0. G0 는 호스트 CPU. GPU 는 VRAM 8 GB 를 Whisper 와 나눠 쓰므로 T22(비전 컨테이너)에서 정한다
    ocr_enable_mkldnn: false   # paddle 3.3 CPU 의 oneDNN 오류 회피
    upright_scale: 3.0         # 송장 펴기 확대 배율 (T18 기준)
    label:
      v_min: 200               # 송장 흰색 HSV (box_tracker seg 와 같은 값)
      s_max: 90
      close_px: 5              # 테두리 작은 끊김만 잇는다. 글자 구멍은 윤곽 채움으로 메운다
    stage1_enough: 2           # 같은 동 크롭 ≥ 2 장 + 투표 신뢰도 ≥ confidence_min 이면 그 트랙은 더 읽지 않는다
    track_forget_s: 30.0       # 이만큼 크롭이 안 온 트랙의 판독 기록을 지운다
    stats_period_s: 5.0        # 입력·판독·OCR 지연 로그 주기
    debug_save_dir: ""         # 지정하면 펴진 송장 크롭을 png 로 남긴다(현장 확인·T19 데이터용, 커밋 금지)
