# docs/interfaces/voss_config.md 가 스키마. 값의 출처는 docs/measurements-1006.md (10/06 실측).
version: 1
zone_map:
  역삼동: A
  대치동: B
  청담동: C
aliases:
  역삼동: [역삼, 역삼동]
  대치동: [대치, 대치동]
  청담동: [청담, 청담동]
zones:   # 플랜지 기준 posx (TCP 미적용), 트레이 안쪽 바닥 중심, 박스 밑면 +5 mm (10/06 트레이 설치 후). grid: cols = X(벨트 방향), rows = Y, offset_mm = 칸 줄 중심의 X 위치(트레이 중심 기준, 없으면 0)
  # 10/12 칸 번호: row 0 = +Y 줄(왼쪽 위 0·1·2, 왼쪽 아래 3·4·5). 채우는 순서 A·B·C 모두 0,1,2,3,4,5 (10/14 사용자 요청, 왼쪽 위부터), 2층 칸 6 = 칸 0 위
  A:       {pose: [213.49, 165.23, 258.27, 35.36, -180.0, -54.64], grid: {cols: 3, rows: 2, pitch_mm: 60, pitch_y_mm: 60, layers: 2, order: [0, 1, 2, 3, 4, 5]}}
  B:       {pose: [446.08, 160.78, 258.94, 14.28, 180.0, -75.33], grid: {cols: 3, rows: 2, pitch_mm: 60, pitch_y_mm: 60, layers: 2, order: [0, 1, 2, 3, 4, 5]}}
  C:       {pose: [675.14, 158.69, 260.94, 159.7, -180.0, 70.28], grid: {cols: 3, rows: 2, pitch_mm: 50, offset_mm: -30, pitch_y_mm: 60, layers: 2, order: [0, 1, 2, 3, 4, 5]}, in_tray_tcp_z_mm: 40}   # 칸 −80/−30/+20: 수직 자세로 +X 쪽은 팔이 닿지 않음(10/08 ikin, +20 위 TCP 61 까지). 10/12 ikin: +X·+Y 끝 칸(row 0 = +Y 로 바꾼 뒤 칸 2) 위 TCP 40 까지(J3 16°) → 10/12 에는 트레이가 빌 때 먼저 놓았으나(order 2,5,…) 10/14 순서 0..5 로 바꿈 — 칸 2·5 는 옆 칸 박스 위를 지나므로 실기 확인 필요, 트레이 안 TCP 40
  recheck: {pose: [446.17, -69.04, 260.65, 169.44, -180.0, 79.38], grid: {cols: 2, rows: 1, pitch_mm: 60}, view_pose: [520.58, -37.92, 367.14, 169.44, -180.0, 79.38]}   # view_pose: 카메라가 트레이 중심 위 약 300 mm (measurements-1008 #13)
  hold:    {pose: [674.12, -71.37, 262.65, 168.88, -180.0, 78.38], grid: {cols: 2, rows: 1, pitch_mm: 60}}
  pallet:  {pose: [-158.82, 251.05, 258.27, 35.36, -180.0, -54.64], grid: {cols: 4, rows: 2, pitch_mm: 50, pitch_y_mm: 60, layers: 2, order: [0, 4, 8, 12, 1, 5, 9, 13, 2, 6, 10, 14, 3, 7, 11, 15]}}   # 팔레타이징 트레이(트럭 짐칸, BRD 10.7). order = 적재 순서(10/13: 트럭 안쪽 열부터 열 단위). 10/12 칸 3(베이스 166 mm) 1206 → 트레이를 +Y 80 mm 옮겨 재측정(펜던트 조그, 플랜지 x·y). z·자세 = A 와 같음. 4×2 × 2층 = 16
observe_pose: [-11.51, -271.11, 450.16, 85.25, -179.07, -6.03]   # 플랜지 기준. 홈과 같음
robot:
  tcp_offset_mm: [1.382, 2.684, 246.642]   # 플랜지 → 핑거 끝 TCP (툴 좌표). 펜던트 등록값 (measurements #6)
belt:
  speed_cmps: 4.56          # 10/13 S4 실기 결과·팀 합의: 중심 파지 FF (실제 벨트 h250 4.73 보다 낮춰 숨은 하류 쏠림 ≈ +3 mm 상쇄). 이전 4.8 = voss_config.before_1014_s4.yaml
  direction_base: [0.99992, -0.01292, 0.0]   # 진행 방향 단위벡터(베이스 기준), +x 에서 −0.74°, z = 0 수평 성분만 (measurements #6, 김학민)
gripper:   # 폭은 RG2 보고값. 실측 안쪽 간격: 보고 90 → 80 mm, 빈손 보고 39 → 28 mm(10/08), 박스 파지 보고 40.3 → 30 mm(10/06) — 차이 10~11 mm 의 관측 특성이라 보정식으로 쓰지 않는다 (measurements #8)
  pre_open_mm: 90
  place_open_mm: 50   # 트레이 안 놓기 개방 폭(보고값). 10/12 실측: 50 에서 박스가 떨어짐(최소), 3×2 칸에서 핑거가 벽·옆 박스에 닿지 않게
  pick_open_mm: 50    # 트레이(A·B·C·재확인·보류)에서 집기 전 여는 폭(보고값 ≈ 실제 40, 박스 31 양쪽 약 4.5 mm). 10/12 사용자 설정 = 놓기 폭·WebLogic 과 같음
  grasp_width_mm: 39
  force_n: 14.0
ocr:
  confidence_min: 0.6
  codes: {"S07-01": "역삼동", "S07-02": "대치동", "S07-03": "청담동"}
timing:
  latency_offset_ms: 0     # 0 = 보정 없음(유효값). 양수 = 벨트 방향으로 앞당겨 예측 (박병후 튜닝)
