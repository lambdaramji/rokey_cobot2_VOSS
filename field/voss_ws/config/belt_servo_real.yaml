# belt_servo 실기 파라미터 — 10/10 G0 용 초안 (제안값, 2026-10-10 02:xx 박병후 개인 PC 에서 작성)
# 출처: PR #132 config/belt_servo_sim.yaml 의 제안값(교차 검사 통과, READY 확인) + example 주석.
# 모든 null 이던 값은 **제안값**이다 — 실기 뒤 measurements 에 남기고 갱신한다. 결정값: tcp_z 19, x_min −107, x_max 620, pose_lag 0(joint_states 시험값, service 면 60 — #135 T7), rate 30.
# 기동 (공용 PC, 사람이 비상정지 옆에서, G0 runbook T7):
#   ros2 launch voss_servo belt_servo.launch.py params:=~/voss_ws/config/belt_servo_real.yaml log_dir:=$HOME/voss_ws/src/rokey_cobot2_VOSS/data/servo
#   첫 실기(FF 만, U4): 위 명령 끝에  overrides:=~/voss_ws/config/belt_servo_kp0.yaml
# 규칙: belt.*·gripper.*·timing.* 은 여기 쓰지 않는다(voss_config.yaml 을 launch 가 읽음). 이 파일은 레포 밖, 커밋 금지.
# 제안값 근거: design/U2-dd.md 7절, measurements-1008 #14(T34), ADR-0010. 접근 40·들기 50 은 실기에서 시야·트레이 간섭 눈으로 확인.
belt_servo:
  ros__parameters:
    grasp:
      tcp_z_below_top_mm: 19.0
      hold_width_min_mm: 39.5
      hold_width_max_mm: 44.0      # 박병후 결정(10/10, 김학민 15:53 안내로 전달). 레포 기본 43.5 는 G1 뒤 병후 PR
      close_time_max_s: 2.5          # 10/14 S4: T29 값(main fec4c77)
      room_margin_mm: 10.0
    reach:
      x_min_mm: -107.0
      x_max_mm: 550.0                # 10/14 S4: T29 값
    control:
      kp_per_s: 1.0
      kp_z_per_s: 1.5
      align_tol_along_mm: 3.0
      align_tol_cross_mm: 5.0
    limits:
      max_speed_mps: 0.08
      max_acc_mps2: 0.1
    z:
      profile: trapezoid           # 10/13 S4 실기 결과·팀 합의(FF 4.56 과 5/5 OK, 착지 82.9 mm, 회차 −2 s). 되돌림: 이 줄 지움(= p)
      approach_above_top_mm: 40.0
      lift_above_top_mm: 50.0
      vision_cutoff_above_top_mm: 30.0
      descend_speed_mps: 0.05
      lift_speed_mps: 0.08
      height_tol_mm: 2.0
#      lift_done_below_mm: 30.0 # 10/14 S4: 끔(30 이면 LIFT 가 끝점 27~31 mm 지나침, U12). 원본 before_1014_s4   # 10/12 로컬 시험(학민): LIFT 를 윗면 +18 mm 에서 끝냄(P 꼬리 2.7 s → 0.9 s). 10/13 U9 파일에 다시 넣음
    input:
      stale_timeout_s: 0.3
      lost_timeout_s: 0.5
      pose_lag_ms: 0.0             # joint_states 미측정 — 시험값 0 (pose stamp 의 물리→stamp 지연만, DESIGN r7 DEC-03·#135 T7, PL 10/10). service 면 60. #140 의 15 ms 는 box_tracker 용(영상 대비 상대 지연)
      pose_extrap_max_ms: 200.0
      blind_entry_max_age_s: 0.15
    retry:
      max_attempts: 1
    stop_timeout_s: 1.0
    gripper_timeout_s: 4.0         # 10/14 S4: #33
    rate_hz: 30.0
    zero_hold_s: 0.2               # 10/12 로컬 시험(학민): 0.5 → 0.2 (gateway 대기 0.7 → 0.4 s). 10/13 U9 파일에 다시 넣음
    log:
      dir: data/servo              # T7 의 log_dir:= 가 절대 경로로 덮어쓴다
