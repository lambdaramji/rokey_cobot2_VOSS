# T13 #22 Nginx 단일 진입점: React 정적 파일 + Spring REST/SSE.
# /ai를 Nginx에 연결하지 않는다(ADR-0006).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 로컬 HMI를 원격 페이지 iframe에 삽입해 운전 명령을 누르지 못하게 한다.
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # 그리퍼 카메라는 송출 노드처럼 공용 PC 로컬에서만 본다(Wi-Fi 쪽 80 으로 다시 열지 않는다).
    location /camera/gripper/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8091/;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # USB 카메라도 공용 PC 로컬에서만 볼 수 있다.
    location /camera/usb/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8092/;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
